<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Өрнегімен өрілген кілем</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=PT+Sans:wght@400;700&family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root{--bg:#f7f1e3;--fg:#1a1630;--card:#fffaf0;--indigo:#1d2a6b;--red:#d8402a;--gold:#f2b705;--mute:#5a5670;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--fg:#f1ead8;--card:#1d1a3b;--mute:#b4afc8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14122b;--fg:#f1ead8;--card:#1d1a3b;--mute:#b4afc8;color-scheme:dark}
*{box-sizing:border-box}
:lang(ko){word-break:keep-all}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--fg);font:400 18px/1.7 "PT Sans","Noto Sans KR",system-ui,sans-serif}
h1,h2,h3{font-family:Merriweather,"Noto Serif KR",Georgia,serif;line-height:1.2;margin:0 0 .6em}
img{max-width:100%;display:block}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;background:var(--indigo);color:#fff}
header nav{display:flex;gap:6px;flex-wrap:wrap}
header a{position:relative;color:#fff;text-decoration:none;font:700 15px "PT Sans","Noto Sans KR",sans-serif;padding:7px 14px 7px 27px;border-radius:999px;transition:background .2s,color .2s}
header a::before{content:"";position:absolute;left:12px;top:50%;width:7px;height:7px;background:var(--gold);transform:translateY(-50%) rotate(45deg);transition:background .2s}
header a:hover{background:var(--gold);color:#1a1630}
header a:hover::before{background:var(--red)}
.lang{display:flex;border:2px solid var(--gold);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:none;color:#fff;font:700 14px "PT Sans","Noto Sans KR",sans-serif;padding:6px 14px;cursor:pointer}
.lang button.on{background:var(--gold);color:#1a1630}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{position:relative;min-height:78vh;display:grid;align-items:end;color:#fff;background:var(--indigo)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,18,60,.92),rgba(20,18,60,.25) 70%)}
.hero div{position:relative;z-index:1;max-width:900px;padding:48px 24px 56px}
.hero h1{font-size:clamp(28px,4.8vw,50px);line-height:1.3;margin-bottom:28px}
.btn{display:inline-block;background:var(--gold);color:#1a1630;font-weight:500;padding:12px 26px;border-radius:999px;text-decoration:none}
.zig{height:20px;background:linear-gradient(135deg,var(--red) 25%,transparent 25%) -10px 0/20px 20px,linear-gradient(225deg,var(--red) 25%,transparent 25%) -10px 0/20px 20px,var(--gold)}
section{max-width:1040px;margin:0 auto;padding:72px 24px}
h2{font-size:clamp(26px,4vw,38px);color:var(--indigo)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:var(--gold)}}
:root[data-theme="dark"] h2{color:var(--gold)}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center}
.split figure{margin:0}
.split img{border-radius:6px;border:6px solid var(--card);box-shadow:0 0 0 2px var(--red)}
figcaption{font-size:14px;color:var(--mute);margin-top:12px}
.steps,.types{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}
.steps div,.types div{background:var(--card);padding:24px;border-top:5px solid var(--red)}
.types div{border-top-color:var(--indigo)}
.steps b{font:700 30px Merriweather,serif;color:var(--red)}
.steps h3,.types h3{font-size:20px;margin:.2em 0 .4em}
.steps p,.types p{margin:0;color:var(--mute);font-size:16px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.gal img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/5}
.end{background:var(--indigo);color:#fff;text-align:center;max-width:none}
.end>div{max-width:720px;margin:0 auto}
.end h2{color:var(--gold)}
blockquote{margin:32px 0 0;font:600 clamp(22px,3.4vw,32px)/1.4 Merriweather,"Noto Serif KR",serif;color:var(--gold)}
footer{text-align:center;padding:24px;color:var(--mute);font-size:14px}
.gen{display:block;width:100%;height:auto;border:6px solid var(--card);box-shadow:0 0 0 2px var(--red)}
.works{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.works img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;border:6px solid var(--card);box-shadow:0 0 0 2px var(--red)}
@media (max-width:760px){.split,.steps,.types,.gal,.hw,.works{grid-template-columns:1fr}header nav{display:none}section{padding:52px 20px}}
</style>
</head>
<body>
<header>
<nav><a href="#history" data-i="n1"></a><a href="#craft" data-i="n2"></a><a href="#types" data-i="n3"></a><a href="#end" data-i="n4"></a></nav>

<div><b>3</b><h3 data-i="s3"></h3><p data-i="s3t"></p></div>
</div></section>

<div class="types">
<div><h3 data-i="k1"></h3><p data-i="k1t"></p></div>
<div><h3 data-i="k2"></h3><p data-i="k2t"></p></div>

<footer>© 2026 · <span data-i="h1"></span></footer>

<script>
const T={kk:{

p2:"Қазақ халқының тұрмысында кілемнің орны ерекше болған. Кілемдер үйдің сәнін келтіріп қана қоймай, халықтың мәдениетін, дүниетанымын және ұлттық дәстүрін бейнелеген. Қазақ кілемдерінде қошқармүйіз, тұмарша, ирек және басқа да ою-өрнектер жиі кездеседі. Әрбір өрнектің өзіндік мәні бар.",

function setLang(l){
